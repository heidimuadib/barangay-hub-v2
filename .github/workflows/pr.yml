# =============================================================================
# Pull-request pipeline (Phase 6 §21)
#
# PLACEMENT: resolved. DEC-REPO-01 promoted the application to its own
# standalone repository (see docs/runbooks/repository-promotion.md). Since
# ADR-0007 the repository is a pnpm workspace: the four jobs below invoke the
# same ROOT scripts as before (`pnpm run …`), which now delegate into
# `apps/web` and `backend` — so a job's behaviour is identical whether run
# here or on a developer machine.
#
# The four job NAMES are load-bearing: the main-branch ruleset requires them
# as status checks by exact string. Rename one and merges stop.
#
# `pull_request` is unfiltered so that stacked PRs (a branch based on another
# feature branch, e.g. refactor/monorepo on the Slice 2 branch) get the same
# four checks as PRs to main. `push` stays main-only.
#
# No secret of any kind is required. Every value below is a public setting or a
# deliberately fake fixture, because CI touches no hosted environment.
# =============================================================================

name: pull-request

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # pnpm 11 requires Node >= 22.13 (see engines in package.json).
  NODE_VERSION: '22.14.0'
  # Fake but structurally valid configuration. The application validates its
  # environment at build time, so these must parse — they must never be real.
  APP_ENV: test
  NEXT_PUBLIC_APP_ENV: test
  NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key-000000000000000
  LOG_LEVEL: warn

jobs:
  # ── Static quality gates and unit tests ────────────────────────────────────
  quality:
    name: typecheck · lint · unit tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the environment template
        run: pnpm run check:env-example

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Unit and component tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      # Runs after the build so it inspects what actually shipped, not the source.
      - name: Scan the client bundle for secret material
        run: pnpm run check:bundle-secrets

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: apps/web/coverage/
          retention-days: 7
          if-no-files-found: ignore

  # ── Database: migrations replay from empty, then pgTAP ─────────────────────
  database:
    name: migrations · pgTAP · type drift
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the local Supabase stack
        run: pnpm run db:start

      # Replays every migration from an empty database. A migration that only
      # works incrementally against a developer's existing state fails here.
      - name: Reset and replay all migrations
        run: pnpm run db:reset

      - name: Run pgTAP tests
        run: pnpm run db:test

      # The committed types must match the migrations, or every consumer of a
      # database type is compiling against a schema that no longer exists.
      - name: Check generated types for drift
        run: pnpm run types:check

      - name: Stop the stack
        if: always()
        run: pnpm --filter @barangay-hub/supabase exec supabase stop --no-backup

  # ── End-to-end suite (smoke + identity) ────────────────────────────────────
  # Slice 1: the identity suite signs in with seeded synthetic accounts, so the
  # job runs the local Supabase stack and exports its throwaway keys at
  # runtime. No committed file ever carries a key-shaped value.
  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start the local Supabase stack (applies migrations and seeds)
        run: pnpm run db:start

      - name: Export the stack's throwaway keys for the dev server
        run: |
          eval "$(pnpm --filter @barangay-hub/supabase exec supabase status -o env | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=')"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Install Playwright browsers
        run: pnpm run e2e:install

      - name: Run e2e suites
        run: pnpm run e2e

      - name: Stop the stack
        if: always()
        run: pnpm --filter @barangay-hub/supabase exec supabase stop --no-backup

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # ── Secret scanning ────────────────────────────────────────────────────────
  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: a secret removed in a later commit is still leaked.
          fetch-depth: 0

      - name: Scan the repository and its history
        uses: gitleaks/gitleaks-action@v2
        env:
          # Required by gitleaks-action v2 even for plain scanning — it exits
          # immediately without it. The default workflow token; no extra scope.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
